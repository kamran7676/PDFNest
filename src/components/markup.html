

    <div id="app" class="min-h-screen flex flex-col">
        <!-- Top Navigation Header -->
        <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="/" class="flex items-center gap-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    </div>
                    <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">PDFNest</span>
                    <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800">100% Local</span>
                </a>
                
                <!-- Quick Command Search Trigger -->
                <button onclick="toggleCommandPalette(true)" class="hidden sm:flex items-center gap-3 px-3.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-100/60 dark:bg-slate-800/60 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:border-slate-300 dark:hover:border-slate-700 text-sm transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <span>Search tools...</span>
                    <kbd class="hidden md:inline-block px-1.5 py-0.5 text-[10px] font-mono font-medium rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-300 dark:border-slate-600">⌘K</kbd>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <!-- AI Settings Modal Button -->
                

                <!-- Dark/Light Theme Toggle -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
                    <svg id="themeIconSun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <svg id="themeIconMoon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Body Area -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar Navigation -->
            <aside id="sidebar" class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 p-4 hidden lg:flex flex-col justify-between shrink-0 overflow-y-auto">
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 px-3">Categories</h2>
                        <nav id="categoryNav" class="space-y-1">
                            <!-- Populated dynamically -->
                        </nav>
                    </div>

                    <div>
                        <h2 class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 px-3">Favorites & Recents</h2>
                        <div id="favoritesList" class="space-y-1 text-sm text-slate-500 dark:text-slate-400 px-3">
                            <span class="text-xs italic">No favorite tools yet. Star tools to pin them here!</span>
                        </div>
                    </div>
                </div>

                <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/50 text-xs text-slate-500 dark:text-slate-400">
                    <p class="font-semibold text-slate-700 dark:text-slate-200 mb-1">🔒 Privacy First</p>
                    Your files are processed locally inside your browser and never uploaded to any server.
                </div>
            </aside>

            <!-- Dynamic View Container -->
            <main id="mainContent" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                <!-- Dynamic view (Home or ToolPage) rendered here -->
            </main>
        </div>
    </div>

    <!-- Command Palette Modal -->
    <div id="commandPalette" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden items-start justify-center pt-20 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-xl w-full border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden flex flex-col max-h-[70vh]">
            <div class="p-3 border-b border-slate-200 dark:border-slate-700 flex items-center gap-3">
                <svg class="w-5 h-5 text-slate-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="cmdInput" oninput="filterCommandPalette(this.value)" placeholder="Type a tool name or category..." class="w-full bg-transparent border-none outline-none text-slate-900 dark:text-white placeholder-slate-400 text-sm py-1">
                <kbd class="px-2 py-0.5 text-[10px] rounded bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 border border-slate-300 dark:border-slate-600">ESC</kbd>
            </div>
            <div id="cmdList" class="divide-y divide-slate-100 dark:divide-slate-700/50 overflow-y-auto p-2 space-y-1">
                <!-- Command palette results populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
